services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palmera
    ports:
      - "5434:5432"
    volumes:
      - palmera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palmera"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  # Optional. The demo runs with `pnpm dev` against this Postgres.
  # Start it only if you want a containerized Next.js build:
  # docker compose --profile full up -d --build
  app:
    profiles: ["full"]
    build:
      context: .
      args:
        NEXT_PUBLIC_DONATION_CHAIN_ID: ${NEXT_PUBLIC_DONATION_CHAIN_ID:-43113}
        NEXT_PUBLIC_UNLOCK_CHAIN_ID: ${NEXT_PUBLIC_UNLOCK_CHAIN_ID:-11155111}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_MUNAY_LOCK_ADDRESS: ${NEXT_PUBLIC_MUNAY_LOCK_ADDRESS:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/palmera
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: "Munay <no-reply@munay.local>"
      NEXT_PUBLIC_DONATION_CHAIN_ID: ${NEXT_PUBLIC_DONATION_CHAIN_ID:-43113}
      NEXT_PUBLIC_UNLOCK_CHAIN_ID: ${NEXT_PUBLIC_UNLOCK_CHAIN_ID:-11155111}
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
      NEXT_PUBLIC_MUNAY_LOCK_ADDRESS: ${NEXT_PUBLIC_MUNAY_LOCK_ADDRESS:-}
    ports:
      - "3000:3000"

volumes:
  palmera_pgdata:
